%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/fpt,ttcm03921235.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FPT TTCM03921235 AMOLED panel

maintainers:
  - marvin <marvin@bvio.ai>

description: |
  The FPT TTCM03921235 is a 1080x1240 four-lane MIPI-DSI AMOLED
  module using a factory-programmed Chip Wealth CH13726A controller.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: fpt,ttcm03921235

  reg:
    maxItems: 1

  power-supply:
    description: 3.0 V VCI panel supply

  reset-gpios:
    maxItems: 1
    description: Active-low panel reset

  fpt,bootloader-initialized:
    type: boolean
    description: |
      The bootloader has already powered and initialized the panel and is
      displaying a logo. The driver preserves that state across the Linux
      display handoff and performs the full sequence after the first power
      cycle.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

required:
  - compatible
  - reg
  - power-supply
  - reset-gpios
  - ports

additionalProperties: false

examples:
  - |
    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "fpt,ttcm03921235";
            reg = <0>;
            power-supply = <&lcd_vci>;
            reset-gpios = <&gpio3 4 1>;
            fpt,bootloader-initialized;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;

                    panel_in: endpoint {
                        remote-endpoint = <&dsi_out>;
                    };
                };
            };
        };
    };
...
